# 放到 /etc/nginx/sites-available/huanxuanhealthcare.tech
# ln -s /etc/nginx/sites-available/huanxuanhealthcare.tech /etc/nginx/sites-enabled/
# 先用 80 跑通，再 certbot --nginx -d huanxuanhealthcare.tech -d www.huanxuanhealthcare.tech

upstream yinji {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name huanxuanhealthcare.tech www.huanxuanhealthcare.tech;

    client_max_body_size 8m;

    location / {
        proxy_pass http://yinji;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
